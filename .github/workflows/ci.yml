name: ci
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        shared: [OFF, ON]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DLIBMYBENCH_WERROR=ON -DBUILD_SHARED_LIBS=${{ matrix.shared }} -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
  sanitize-fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with ASan/UBSan and fuzz targets
        run: |
          CC=clang cmake -S . -B build -DLIBMYBENCH_FUZZ=ON -DLIBMYBENCH_WERROR=ON \
            "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all"
          cmake --build build -j 4
          ctest --test-dir build --output-on-failure
      - name: Fuzz 60 s each
        run: |
          ./build/drivers/ppk2/ppk2_fuzz_meta -max_total_time=60 -max_len=8192
          ./build/drivers/ppk2/ppk2_fuzz_stream -max_total_time=60 -max_len=8192
